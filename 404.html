<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'" />
  <title>Page introuvable · Yanis Poulain</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#fafaf9" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c3aed'/><text x='50' y='67' font-size='52' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'>YP</text></svg>" />
  <!-- Page autonome : GitHub Pages peut la servir à n'importe quelle adresse du site,
       les styles sont donc intégrés et les liens absolus -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: radial-gradient(circle at 70% 20%, #ede9fe, transparent 45%), #fafaf9;
      color: #111018;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 520px; }
    .code { font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; letter-spacing: 0.12em; color: #7c3aed; }
    h1 { margin-top: 12px; font-size: clamp(2.2rem, 9vw, 3.4rem); line-height: 1.05; letter-spacing: -0.03em; }
    h1 em { font-style: normal; color: #7c3aed; }
    p { margin-top: 16px; color: #4a4857; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    a {
      display: inline-flex;
      padding: 11px 20px;
      border: 1px solid #e4e2ea;
      border-radius: 999px;
      background: #fff;
      color: #111018;
      font-weight: 600;
      text-decoration: none;
    }
    a:first-child { background: #111018; border-color: #111018; color: #fff; }
    a:hover, a:focus-visible { border-color: #7c3aed; outline: none; }
    a:first-child:hover, a:first-child:focus-visible { background: #7c3aed; }
  </style>
</head>
<body>
  <main>
    <p class="code">ERREUR 404</p>
    <h1>Cette page <em>n'existe pas.</em></h1>
    <p>L'adresse est peut-être incomplète, ou la page a été déplacée. Le reste du portfolio est juste là.</p>
    <nav aria-label="Pages du portfolio">
      <a href="/portfolio/">Retour au portfolio</a>
      <a href="/portfolio/cv.html">Mon CV</a>
      <a href="/portfolio/e39.html">Projet automobile</a>
    </nav>
  </main>
</body>
</html>
